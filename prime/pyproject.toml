[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-genesis"
version = "0.2.0"
description = "Governed self-evolution control plane for the PRIME platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sasi Pedavalli"}]
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
all = ["openai>=1.0.0", "fastapi>=0.115.0", "uvicorn>=0.30.0"]

[project.scripts]
prime = "prime_genesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
