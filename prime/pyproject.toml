[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prime-genesis"
version = "0.1.0"
description = "Self-evolving AI control plane for the PRIME platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Sasi Pedavalli"}]
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
prime = "prime_genesis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
