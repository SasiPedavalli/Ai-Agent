[identity]
name = "PRIME"
version = "0.4.0"

[evolution]
cadence = "daily"
max_mutation_rounds = 2
mutation_scope = ["prompt", "workflow-policy", "retrieval-policy", "model-route", "response-contract"]
production_code_self_modification = false

[governance]
require_version_lineage = true
require_reversible_change = true
require_human_approval_for_high_impact_actions = true
minimum_safety_score = 1.0
minimum_composite_gain = 0.01
protected_holdout_required_for_production = true
canary_required = true

[canary]
traffic_fraction = 0.10
rollback_on_failure = true

[runtime]
tenant_isolation = true
trusted_gateway_headers = ["X-Prime-Tenant", "X-Prime-Actor", "X-Prime-Roles"]
products = ["guardian-x", "genome", "company-brain", "digital-twin"]
api_triggered_evolution_default = false

[memory]
default_backend = "sqlite"
customer_data_commit_to_git = false

[models]
registry_enabled = true
failover_enabled = true
budget_enforcement = true

[retrieval]
tenant_scoped = true
default_limit = 5
backend = "sqlite-token-overlap"
