trigger:
  branches:
    include:
      - main

stages:
  - stage: Test
    jobs:
      - job: UnitTests
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
          - script: python -m unittest discover -s tests -v
            displayName: Run unit tests

  - stage: GovernanceGate
    dependsOn: Test
    jobs:
      - job: PolicyChecks
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'
          - script: >-
              python -m app.main
              --approved
              --lineage-registered
              --environment test
              --promotion-gate
              --output governance-gate-result.json
            displayName: Run Data & AI Governance policy checks
          - publish: governance-gate-result.json
            artifact: governance-audit

  - stage: PromoteProd
    dependsOn: GovernanceGate
    condition: succeeded()
    jobs:
      - deployment: Production
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Governance checks passed; production promotion is allowed."
