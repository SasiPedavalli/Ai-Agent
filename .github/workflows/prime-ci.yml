name: PRIME CI

on:
  push:
    branches: [main, "agent/prime-*"]
    paths:
      - "prime/**"
      - "docs/**"
      - ".github/workflows/prime-*.yml"
  pull_request:
    paths:
      - "prime/**"
      - "docs/**"
      - ".github/workflows/prime-*.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: prime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PRIME
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run cumulative evolution smoke test
        run: |
          mkdir -p artifacts/ci-state
          prime evolve \
            --benchmark data/benchmarks.jsonl \
            --holdout data/holdout.calibration.jsonl \
            --db artifacts/ci-state/prime.db \
            --state artifacts/ci-state/champion.json \
            --history artifacts/ci-state/history.jsonl \
            --json-report artifacts/ci-state/latest-report.json
          prime status \
            --state artifacts/ci-state/champion.json \
            --history artifacts/ci-state/history.jsonl \
            --json
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: prime-v02-ci-evidence
          path: prime/artifacts/ci-state
          retention-days: 14
