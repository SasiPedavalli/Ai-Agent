name: PRIME CI

on:
  push:
    branches: [main, agent/prime-genesis]
    paths:
      - "prime/**"
      - "docs/**"
      - ".github/workflows/prime-*.yml"
  pull_request:
    paths:
      - "prime/**"
      - "docs/**"
      - ".github/workflows/prime-*.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run evolution smoke test
        run: PYTHONPATH=src python -m prime_genesis.cli evolve --benchmark data/benchmarks.jsonl --db artifacts/prime.db --json-report artifacts/latest-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: prime-genesis-report
          path: prime/artifacts/latest-report.json
